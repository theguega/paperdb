[project]
name = "paperdb"
version = "0.1.0"
description = "Local corpus of robotics papers (VLA, world-action models, control) that an agent can query."
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pydantic>=2",
    "httpx>=0.27",
    "pyyaml>=6",
    "tomli-w>=1",
]

[project.scripts]
paperdb = "paperdb.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["uv_build>=0.7,<1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "paperdb"
module-root = ""

