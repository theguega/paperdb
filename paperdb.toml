[agent]
adapter = "claude"        # claude | cursor | cline
concurrency = 2
timeout_s = 300           # mandatory: cursor print-mode can hang indefinitely

[agent.adapters.claude]
argv = ["claude", "-p", "--output-format", "json",
        "--allowedTools", "Read", "--max-turns", "3"]
prompt = "stdin"
envelope = "json"
text_path = "result"

[agent.adapters.cursor]
argv = ["agent", "-p", "--output-format", "json", "--trust", "--mode", "ask"]
prompt = "arg"
envelope = "json"
text_path = "result"

[agent.adapters.cline]
argv = ["cline", "--json"]
prompt = "arg"           # cline 3.x rejects piped stdin in --json mode
envelope = "ndjson"
text_path = "text"

[paths]
corpus = "corpus"

[parse]
# hf reads arXiv's HTML via the Hugging Face CLI - no PDF needed. Papers the Hub
# can't serve (most pre-2022, un-indexed IDs) fall back to fallback_backend,
# which downloads the PDF on demand.
backend = "hf"                       # hf | pymupdf4llm | docling
fallback_backend = "pymupdf4llm"     # pymupdf4llm | docling (local, no keys)
