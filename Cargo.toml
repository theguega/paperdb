[package]
name = "paperdb"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Personal paper library: one binary, a git-synced folder, an agent skill."
license = "MIT"
repository = "https://github.com/theguega/paperdb"

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
undocumented_unsafe_blocks = "deny"
must_use_candidate = "warn"

[profile.release]
lto = true
strip = true
